<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d1b">
  <!--
    Content Security Policy. GitHub Pages cannot send HTTP headers, so it is delivered as a meta tag.
    No inline scripts, no eval, no third-party script hosts. connect-src is limited to WalletConnect/Reown
    and the public chain data endpoints used for read-only balances.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.reown.com; connect-src 'self' https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://*.reown.com wss://*.reown.com https://*.web3modal.org https://*.web3modal.com https://*.publicnode.com https://eth.llamarpc.com https://bsc-dataseed.binance.org https://polygon-rpc.com https://arb1.arbitrum.io https://mainnet.optimism.io https://mainnet.base.org https://api.mainnet-beta.solana.com https://api.trongrid.io; frame-src https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="NEXORA — Multi-Chain Portfolio. Choose a network, connect a wallet and show your public address. Read-only: no transactions, no approvals.">
  <meta property="og:title" content="NEXORA — Multi-Chain Portfolio">
  <meta property="og:description" content="Read-only multi-chain wallet view: public address and real balances.">
  <meta property="og:type" content="website">
  <title>NEXORA — Multi-Chain Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">تخطَّ إلى المحتوى</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="NEXORA">
        <span class="brand-mark" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M4 18V6l16 12V6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="6" r="2" fill="#72e4cc"/></svg></span>
        <span class="brand-text"><span class="brand-name">NEXORA</span><span class="brand-tag">Multi-Chain Portfolio</span></span>
      </a>
      <div class="top-actions">
        <span class="pill" id="statusPill" data-state="disconnected" role="status"><i class="dot" aria-hidden="true"></i><span id="statusPillText" data-i18n="pill.disconnected">غير متصل</span></span>
        <button class="chip-btn" id="langBtn" type="button" lang="en"><span data-i18n="lang.toggle">English</span></button>
      </div>
    </header>

    <main id="main">
      <!-- Primary flow: choose network -> show address -->
      <section class="hero panel" aria-labelledby="heroTitle" id="top">
        <p class="eyebrow"><span class="eyebrow-icon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></span><span data-i18n="hero.eyebrow">محفظة متعددة الشبكات</span></p>
        <h1 id="heroTitle" data-i18n="hero.title">اختر الشبكة، ثم أظهر عنوانك</h1>
        <p class="lead" data-i18n="hero.sub"></p>

        <h2 class="step" id="stepNetworkLabel" data-i18n="step.network">1 · اختر الشبكة</h2>
        <div class="net-grid" id="networkGrid" role="radiogroup" aria-labelledby="stepNetworkLabel"></div>
        <p class="note" data-i18n="standards.note"></p>

        <h2 class="step" data-i18n="step.show">2 · اتصل بمحفظتك</h2>
        <div class="cta-row">
          <button class="btn primary big" id="showBtn" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <span id="showBtnText" data-i18n="btn.show">إظهار العنوان</span>
          </button>
          <button class="btn ghost" id="disconnectBtn" type="button" hidden data-i18n="btn.disconnect">فصل المحفظة</button>
        </div>

        <div id="addressView" class="address-view" aria-live="polite"></div>
      </section>

      <section class="panel" id="actionsPanel" aria-labelledby="actionsTitle">
        <div class="panel-head"><h2 id="actionsTitle" data-i18n="act.title">الإجراءات</h2></div>
        <div class="actions-grid" id="actionsGrid"></div>
        <p class="status info" id="actionNote" hidden role="status"></p>
      </section>

      <section class="panel" id="balancesPanel" aria-labelledby="balTitle">
        <div class="panel-head">
          <div>
            <h2 id="balTitle" data-i18n="bal.title">الأرصدة والمحفظة</h2>
            <p class="sub" id="balSub"></p>
          </div>
          <div class="panel-tools">
            <span class="badge live" data-i18n="bal.live">بيانات حقيقية من السلسلة</span>
            <button class="btn ghost small" id="refreshBtn" type="button" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
              <span data-i18n="btn.refresh">تحديث</span>
            </button>
          </div>
        </div>
        <div id="balanceView" aria-live="polite"></div>
        <p class="note" id="balNote"></p>
      </section>

      <section class="panel security" aria-labelledby="secTitle">
        <div class="panel-head"><h2 id="secTitle" data-i18n="sec.title">الأمان والخصوصية</h2></div>
        <ul class="checks">
          <li data-i18n="sec.1"></li><li data-i18n="sec.2"></li><li data-i18n="sec.3"></li><li data-i18n="sec.4"></li><li data-i18n="sec.5"></li>
        </ul>
      </section>
    </main>

    <footer class="footer"><span data-i18n="footer.note"></span></footer>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
